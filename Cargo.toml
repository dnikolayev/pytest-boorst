[package]
name = "pytest-boorst"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native helpers for pytest-boorst"
repository = "https://github.com/dnikolayev/pytest-boorst"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }

[profile.release]
# Avoid misaligned Mach-O string tables from rustc's debuginfo stripping.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
