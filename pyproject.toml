[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pytest-boorst"
version = "0.1.0a6"
description = "Experimental Rust-powered acceleration for pytest"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/dnikolayev/pytest-boorst"
Issues = "https://github.com/dnikolayev/pytest-boorst/issues"

[project.entry-points.pytest11]
boorst = "pytest_boorst.plugin"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest==9.1.1",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
]

[tool.maturin]
python-source = "python"
module-name = "pytest_boorst._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
